services:
  - type: web
    name: makeq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MAKEQ_ENV
        value: production
      - key: MAKEQ_ADMIN_USERNAME
        value: admin
      - key: MAKEQ_ADMIN_PASSWORD
        value: hackathon2026
      - key: MAKEQ_SECRET_KEY
        generateValue: true
